# Proof-gated IaC on AWS - CodeBuild buildspec.
#
# NOTE ON SERVICE CHOICE: CodeDeploy is not the right place for this. CodeDeploy
# deploys APPLICATIONS to EC2/Lambda/ECS through lifecycle hooks on instances;
# it has no step that runs a CLI over your repository. The IaC equivalent on AWS
# is CodePipeline (orchestration + manual approval) driving CodeBuild (the thing
# that actually runs commands). This file is the CodeBuild half; the pipeline
# skeleton is at the bottom.
#
# Vizier's exit code is the integration:
#   0 clean · 1 error · 2 changes pending · 3 proof-gate blocked
#
# CodeBuild's quirk: a phase fails on any non-zero exit from its last command,
# and `set -e` aborts on the first. So the code is captured, acted on, and the
# phase exits deliberately - exit 2 must NOT fail the build, because "there are
# changes" is the drift signal, not a fault.

version: 0.2

env:
  variables:
    VIZIER_VERSION: '1.0.1'
    VIZIER_DIR: 'infrastructure'
    CATALOG_URL: 'https://www.iac-bazaar.com'
    # VIZIER_ACTION is set per CodeBuild project: 'plan' or 'apply'.
    VIZIER_ACTION: 'plan'

phases:

  install:
    runtime-versions:
      golang: 1.22
    commands:
      - |
        set -euo pipefail
        # The asset name carries the version; the tag is `vizier/v<version>`.
        ASSET="vizier_${VIZIER_VERSION}_linux_amd64.tar.gz"
        base="https://github.com/CyberCoreSystems/vizier/releases/download/v${VIZIER_VERSION}"
        # Save under the real asset name -- checksums.txt names files that way.
        curl -fsSL -o "$ASSET" "$base/$ASSET"
        curl -fsSL -o checksums.txt "$base/checksums.txt"
        # A tool for verifying what you run should not install itself unverified.
        # Selecting this asset's line matters: --ignore-missing over the whole
        # file skips every entry when the name is wrong and dies with "no file was
        # verified" -- fail-closed, but it never installs.
        grep -F "$ASSET" checksums.txt | sha256sum --check -
        tar xzf "$ASSET" && chmod +x vizier && mv vizier /usr/local/bin/
      - |
        set -euo pipefail
        curl -fsSL -o tofu.zip \
          "https://github.com/opentofu/opentofu/releases/download/v1.8.7/tofu_1.8.7_linux_amd64.zip"
        unzip -q tofu.zip tofu && chmod +x tofu && mv tofu /usr/local/bin/
        tofu version

  pre_build:
    commands:
      # CodeBuild assumes its service role automatically - no static keys.
      # Give the plan project a READ-ONLY role and the apply project a
      # write-capable one, so a plan can never mutate anything.
      - aws sts get-caller-identity

  build:
    commands:
      - |
        set -uo pipefail
        mkdir -p plans

        # On apply, PLANS_DIR arrives as an input artifact from the plan stage,
        # so the applied change is the one that was reviewed and approved.
        vizier --dir "$VIZIER_DIR" \
               --catalog-url "$CATALOG_URL" \
               --verify-mode enforce \
               --auto-approve \
               run-all "$VIZIER_ACTION" \
               --plan-dir plans \
               $( [ "$VIZIER_ACTION" = "plan" ] && echo --detailed-exitcode ) \
               --receipt vizier-receipt.json \
               --receipt-md vizier-receipt.md
        code=$?

        echo "vizier exit code: $code"
        [ -f vizier-receipt.md ] && cat vizier-receipt.md

        case "$code" in
          0) echo "HAS_CHANGES=false" > vizier.env ;;
          2)
            # A result, not a failure. Recorded for the pipeline to branch on.
            echo "HAS_CHANGES=true" > vizier.env
            echo "Plan has pending changes."
            code=0
            ;;
          3)
            echo "PROOF-GATE BLOCKED: a module could not be proven verified."
            echo "See vizier-receipt.json in the build artifacts."
            ;;
        esac
        exit "$code"

artifacts:
  # The receipts are the audit trail and the plans are the reviewed change.
  # Both are produced even on failure - a receipt for a blocked run is the one
  # you most want afterwards.
  files:
    - 'plans/**/*'
    - 'vizier-receipt.json'
    - 'vizier-receipt.md'
    - 'vizier.env'
  name: vizier-$(date +%Y%m%d-%H%M%S)

# ---------------------------------------------------------------------------
# The surrounding CodePipeline (Terraform for the pipeline itself, abridged):
#
#   stage "Source"   -> CodeStarSourceConnection (GitHub) -> artifact: source
#
#   stage "Plan"     -> CodeBuild project vizier-plan
#                       role: read-only
#                       env:  VIZIER_ACTION=plan
#                       in:   source        out: plan_output   (plans + receipt)
#
#   stage "Approve"  -> Manual approval action
#                       The proof-gate says the modules are verified; a human
#                       still says whether this change should ship. Point the
#                       reviewer at the receipt in plan_output.
#
#   stage "Apply"    -> CodeBuild project vizier-apply
#                       role: write
#                       env:  VIZIER_ACTION=apply
#                       in:   source, plan_output
#                       Applies the SAVED plans, so what ships is what was
#                       approved rather than a fresh plan computed afterwards.
#
# Notes that bite:
#  - Give the two CodeBuild projects DIFFERENT IAM roles. A plan project with
#    write permissions removes the point of splitting the stages.
#  - CodePipeline runs one execution per pipeline by default, which is the
#    serialisation Terraform state needs; do not raise it.
#  - Exit 2 from the plan project must not fail the stage, or every run with
#    changes stops the pipeline before the approval step. That is what the
#    `code=0` line above is for.
# ---------------------------------------------------------------------------
