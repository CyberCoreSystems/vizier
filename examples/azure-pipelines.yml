# Proof-gated IaC pipeline for Azure DevOps.
#
# Vizier's exit code is the whole integration:
#   0 clean · 1 error · 2 changes pending · 3 proof-gate blocked
#
# Azure's quirk is that a script task fails the job on ANY non-zero exit, which
# would make "there are changes" - a normal result - a red build. The plan step
# therefore captures the code, publishes it as an output variable, and exits 0
# for the 2 case while still failing hard on 1 and 3.

trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main] }

schedules:
  # Drift detection. Nothing changed in git; if the plan is not empty, the
  # cloud moved underneath you.
  - cron: '0 6 * * *'
    displayName: Nightly drift check
    branches: { include: [main] }
    always: true

variables:
  VIZIER_VERSION: '1.0.1'
  VIZIER_DIR: 'infrastructure'
  CATALOG_URL: 'https://www.iac-bazaar.com'
  PLAN_DIR: '$(Build.ArtifactStagingDirectory)/plans'

stages:

  - stage: Plan
    jobs:
      - job: plan
        pool: { vmImage: 'ubuntu-latest' }
        steps:

          - checkout: self

          - script: |
              set -euo pipefail
              # The asset name carries the version; the tag is `vizier/v<version>`.
              ASSET="vizier_$(VIZIER_VERSION)_linux_amd64.tar.gz"
              base="https://github.com/CyberCoreSystems/vizier/releases/download/v$(VIZIER_VERSION)"
              # Save under the real asset name -- checksums.txt names files that
              # way, so renaming the download leaves nothing to verify against.
              curl -fsSL -o "$ASSET" "$base/$ASSET"
              curl -fsSL -o checksums.txt "$base/checksums.txt"
              # A tool for verifying what you run should not install itself
              # unverified. Select this asset's line: --ignore-missing over the
              # whole file skips every entry when the name is wrong and then dies
              # with "no file was verified" -- fail-closed, but it never installs.
              grep -F "$ASSET" checksums.txt | sha256sum --check -
              tar xzf "$ASSET"
              chmod +x vizier
              sudo mv vizier /usr/local/bin/vizier
              vizier version
            displayName: 'Install vizier'

          # Workload-identity federation: no long-lived secrets in the pipeline.
          - task: AzureCLI@2
            name: vizierplan
            displayName: 'vizier run-all plan'
            inputs:
              azureSubscription: 'iac-plan-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -uo pipefail
                mkdir -p "$(PLAN_DIR)"

                vizier --dir "$(VIZIER_DIR)" \
                       --catalog-url "$(CATALOG_URL)" \
                       --verify-mode enforce \
                       run-all plan \
                       --plan-dir "$(PLAN_DIR)" \
                       --detailed-exitcode \
                       --receipt "$(Build.ArtifactStagingDirectory)/vizier-receipt.json" \
                       --receipt-md vizier-receipt.md
                code=$?

                # Publish the receipt into the run summary so a reviewer sees it
                # on the build page rather than in scrolled-past log output.
                if [ -f vizier-receipt.md ]; then
                  cp vizier-receipt.md "$(Build.ArtifactStagingDirectory)/"
                  echo "##vso[task.uploadsummary]$(System.DefaultWorkingDirectory)/vizier-receipt.md"
                fi

                case "$code" in
                  0)
                    echo "##vso[task.setvariable variable=hasChanges;isOutput=true]false"
                    ;;
                  2)
                    # A result, not a failure - exit 0 so the stage stays green.
                    echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true"
                    echo "##vso[task.logissue type=warning]Plan has pending changes."
                    ;;
                  3)
                    # Surfaced distinctly: a gate refusal routes to a different
                    # reviewer than a broken plan.
                    echo "##vso[task.logissue type=error]Proof-gate blocked: a module could not be proven verified. See the receipt artifact."
                    echo "##vso[task.complete result=Failed;]"
                    exit 1
                    ;;
                  *)
                    echo "##vso[task.logissue type=error]vizier plan failed (exit $code)"
                    exit 1
                    ;;
                esac
                exit 0

          # Carry the plan files to the apply stage. Without this, apply would
          # re-plan and the approval would have been of a different plan.
          - publish: '$(Build.ArtifactStagingDirectory)'
            artifact: vizier-plan
            displayName: 'Publish plans + receipt'
            condition: always()

  - stage: Apply
    dependsOn: Plan
    condition: >-
      and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(dependencies.Plan.outputs['plan.vizierplan.hasChanges'], 'true'))
    jobs:
      # A deployment job against an Environment is what gives you the approval
      # gate: configure approvers on the 'production' environment in Azure DevOps.
      # The proof-gate says the modules are verified; a human still decides
      # whether this change ships.
      - deployment: apply
        pool: { vmImage: 'ubuntu-latest' }
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: vizier-plan

                - script: |
                    set -euo pipefail
                    ASSET="vizier_$(VIZIER_VERSION)_linux_amd64.tar.gz"
                    base="https://github.com/CyberCoreSystems/vizier/releases/download/v$(VIZIER_VERSION)"
                    curl -fsSL -o "$ASSET" "$base/$ASSET"
                    curl -fsSL -o checksums.txt "$base/checksums.txt"
                    grep -F "$ASSET" checksums.txt | sha256sum --check -
                    tar xzf "$ASSET" && chmod +x vizier
                    sudo mv vizier /usr/local/bin/vizier
                  displayName: 'Install vizier'

                - task: AzureCLI@2
                  displayName: 'vizier run-all apply (from the reviewed plans)'
                  inputs:
                    azureSubscription: 'iac-apply-connection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -uo pipefail
                      vizier --dir "$(VIZIER_DIR)" \
                             --catalog-url "$(CATALOG_URL)" \
                             --verify-mode enforce \
                             --auto-approve \
                             run-all apply \
                             --plan-dir "$(Pipeline.Workspace)/vizier-plan/plans" \
                             --receipt vizier-apply-receipt.json
                      code=$?
                      if [ "$code" -eq 3 ]; then
                        echo "##vso[task.logissue type=error]Proof-gate blocked during apply."
                      fi
                      exit "$code"

                - publish: vizier-apply-receipt.json
                  artifact: vizier-apply-receipt
                  condition: always()
                  displayName: 'Publish the apply receipt'
